system:
  log_level: "INFO"
  automation_timeout_minutes: 90  # 自动化会话超时（分钟）
  completion_action: "sleep"    # 全部完成后 sleep / shutdown / hibernate / none
  completion_action_delay_seconds: 60
  server_chan_enabled: true     # 是否发送 Server酱通知
  server_chan_key: "your_key_here"  # Server酱 SendKey

tasks:
  skyland_sign:
    enabled: true
    interval_hours: 20           # 按间隔执行

  maa:
    enabled: true
    interval_hours: 10
    script_path: "D:\\game\\MAA-v6.13.0-win-x64\\MAA.exe"

  maaend:
    enabled: true
    interval_hours: 10
    script_path: "D:\\game\\MaaEnd-win-x86_64-v2.18.0\\MaaEnd.exe"
