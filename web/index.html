<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AutoGame 任务管理</title>
    <link rel="stylesheet" href="/ui/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark">A</span><span>AutoGame</span></div>
        <nav>
          <button class="nav-item active" data-section="tasks"><span>▤</span>任务</button>
          <button class="nav-item" data-section="logs"><span>▤</span>日志</button>
          <button class="nav-item" data-section="settings"><span>⚙</span>设置</button>
        </nav>
        <div class="connection-status"><span class="status-dot"></span><span id="connectionText">正在连接</span></div>
      </aside>

      <main class="main-content">
        <header class="top-bar">
          <div>
            <p class="eyebrow">自动化控制台</p>
            <h1 id="pageTitle">任务</h1>
          </div>
          <div class="top-actions">
            <button class="secondary-button" id="reloadButton">重新加载配置</button>
            <button class="primary-button" id="topRunButton">▶ 运行任务</button>
          </div>
        </header>

        <section class="summary-cards">
          <article class="summary-card"><span class="summary-icon blue">▣</span><div><strong id="taskCount">0</strong><span>任务总数</span></div></article>
          <article class="summary-card"><span class="summary-icon green">▶</span><div><strong id="runningCount">0</strong><span>正在运行</span></div></article>
          <article class="summary-card"><span class="summary-icon purple">◔</span><div><strong id="overallProgress">0%</strong><span>本次进度</span></div></article>
        </section>

        <section class="content-area" id="tasksSection">
          <div class="task-list-panel">
            <div class="panel-header"><h2>任务列表</h2><span id="updatedAt">等待数据</span></div>
            <div class="table-scroll">
              <table>
                <thead><tr><th>任务名称</th><th>状态</th><th>进度</th><th>最近成功</th><th>操作</th></tr></thead>
                <tbody id="taskTable"></tbody>
              </table>
            </div>
          </div>

          <aside class="detail-panel">
            <div class="panel-header"><h2 id="detailTitle">选择任务</h2><button class="icon-button" id="closeDetails">×</button></div>
            <div id="detailContent" class="detail-content empty-state">请从左侧选择一个任务</div>
          </aside>
        </section>

        <section class="logs-section hidden" id="logsSection">
          <div class="log-header"><h2>最近日志</h2><button class="secondary-button" id="refreshLogsButton">刷新</button></div>
          <pre id="logsContent">暂无日志</pre>
        </section>

        <section class="settings-section hidden" id="settingsSection">
          <div class="log-header"><h2>全局配置</h2><button class="primary-button" id="saveSystemConfigButton">保存全局配置</button></div>
          <div class="settings-form">
            <div class="detail-field"><label>日志级别</label><select id="systemLogLevel"><option>DEBUG</option><option>INFO</option><option>WARNING</option><option>ERROR</option></select></div>
            <div class="detail-field"><label>Webhook 端口（重启后生效）</label><input id="systemPort" type="number" min="1" max="65535"></div>
            <div class="detail-field"><label>任务完成后执行系统动作</label><select id="systemCompletionEnabled"><option value="true">启用</option><option value="false">禁用</option></select></div>
            <div class="detail-field"><label>完成动作延迟（秒）</label><input id="systemDelay" type="number" min="0"></div>
            <div class="detail-field"><label>自动化超时（小时）</label><input id="systemTimeout" type="number" min="0.1" step="0.1"></div>
            <div class="detail-field"><label>完成动作</label><select id="systemCompletionAction"><option value="none">不执行</option><option value="sleep">睡眠</option><option value="hibernate">休眠</option><option value="shutdown">关机</option></select></div>
            <div class="detail-field"><label>Server 酱 SendKey（留空保持原值）</label><input id="systemSendKey" type="password" autocomplete="new-password" placeholder="已配置时不会回显"></div>
            <div class="detail-field"><label><input id="clearSendKey" type="checkbox"> 清除已保存的 SendKey</label></div>
          </div>
          <div class="info-card">
            <p>普通用户模式：直接运行 <code>python main.py</code>，只打开桌面，不会自动启动任务。</p>
            <p>自动化模式：运行 <code>python main.py --automation</code>，按间隔自动扫描到期任务。</p>
            <p>任务和全局配置保存后会直接写入 <code>config.yaml</code>，程序会校验、备份并重新加载。</p>
          </div>
        </section>
      </main>
    </div>
    <div id="toast" class="toast"></div>
    <script src="/ui/app.js"></script>
  </body>
</html>
