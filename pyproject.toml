[project]
name = "auto-game"
version = "0.4.0"
description = "Windows 桌面游戏自动化任务管理器"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=46.0.5",
    "filelock>=3.17.0",
    "loguru>=0.7.3",
    "pydantic>=2.10.0",
    "psutil>=7.0.0",
    "requests>=2.32.5",
    "ruamel.yaml>=0.18.10",
]

[project.optional-dependencies]
desktop = [
    "pywebview>=5.4",
]

[dependency-groups]
dev = [
    "rich>=14.2.0",
]
